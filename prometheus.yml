global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    monitor: redis-cluster-monitor

scrape_configs:
  # Our API exposes per-node Prometheus metrics at /metrics
  - job_name: redis-cluster-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
